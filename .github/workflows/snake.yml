name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # executa todo dia à meia-noite
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: almeidajuh
          outputs: |
            ./output/snake.svg
      - name: Commit generated snake.svg
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: "Update snake animation"
          add: "output/snake.svg"
